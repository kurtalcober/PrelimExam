<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
			background: #f2f4f7;
			color: #1f2937;
			font-family: Arial, sans-serif;
		}

		.login-card {
			width: min(90%, 360px);
			padding: 2rem;
			border: 1px solid #d9dee7;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 8px 24px rgb(31 41 55 / 10%);
		}

		h1 {
			margin: 0 0 1.5rem;
			text-align: center;
			font-size: 1.75rem;
		}

		label {
			display: block;
			margin-bottom: 0.4rem;
			font-weight: 600;
		}

		input {
			width: 100%;
			margin-bottom: 1rem;
			padding: 0.7rem;
			border: 1px solid #c7ced8;
			border-radius: 4px;
			font: inherit;
		}

		button {
			width: 100%;
			padding: 0.75rem;
			border: 0;
			border-radius: 4px;
			background: #2563eb;
			color: #ffffff;
			cursor: pointer;
			font: inherit;
			font-weight: 600;
		}

		button:hover {
			background: #1d4ed8;
		}
	</style>
</head>
<body>
	<main class="login-card">
		<h1>Login</h1>
		<form>
			<label for="email">Email</label>
			<input id="email" name="email" type="email" autocomplete="email" required>

			<label for="password">Password</label>
			<input id="password" name="password" type="password" autocomplete="current-password" required>

			<button type="submit">Log in</button>
		</form>
	</main>
</body>
</html>
